<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>benchtop</title><meta name="description" content="Interactive 3D explainers.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314110f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%237fd3ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/fonts/fonts.css">
<style>
:root{--bg:#14110f;--ink:#ece6dc;--ink-dim:#9a9186;--accent:#7fd3ff;--card:#1c1815;--line:rgba(255,255,255,.12)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Inter,system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:40px 16px 64px}
h1{font:700 56px/1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.04em;text-transform:uppercase;margin:0}
header p{color:var(--ink-dim);margin:6px 0 24px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
nav button{font:inherit;font-size:13px;color:var(--ink-dim);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-pressed=true]{color:var(--bg);background:var(--accent);border-color:var(--accent)}
nav button span{opacity:.6;margin-left:4px}
#tags button{font-size:12px;padding:3px 10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:24px}
#grid a{display:block;color:inherit;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s,border-color .15s}
#grid a:hover,#grid a:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
#grid img{display:block;width:100%;height:auto;aspect-ratio:1200/630;object-fit:cover;background:#000}
#grid div{padding:12px 14px 14px}
.k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.t{font:600 24px/1.1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.03em;text-transform:uppercase;margin-top:4px}
#empty{color:var(--ink-dim)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#grid a{transition:none}#grid a:hover{transform:none}}
</style></head>
<body><main>
<header><h1>benchtop</h1><p>Interactive 3D explainers. Pick one.</p></header>
<nav id="types" aria-label="Type"></nav>
<nav id="tags" aria-label="Tag"></nav>
<div id="grid"></div>
<p id="empty" hidden>Nothing matches.</p>
</main>
<script type="module">
const works = await (await fetch('works.json')).json();
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const count = (arr, f) => arr.reduce((m, w) => (f(w).forEach(k => m.set(k, (m.get(k) || 0) + 1)), m), new Map());
let type = 'all', tag = null;

function chip(label, n, on, click) {
  const b = document.createElement('button');
  b.innerHTML = `${esc(label)}<span>${n}</span>`; b.setAttribute('aria-pressed', on); b.onclick = click;
  return b;
}
function render() {
  const types = count(works, w => [w.type]);
  $('types').replaceChildren(chip('All', works.length, type === 'all', () => { type = 'all'; tag = null; render(); }),
    ...[...types].map(([t, n]) => chip(t[0].toUpperCase() + t.slice(1), n, type === t, () => { type = t; tag = null; render(); })));
  const ofType = works.filter(w => type === 'all' || w.type === type);
  const tags = [...count(ofType, w => w.tags)].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  $('tags').replaceChildren(...tags.map(([t, n]) => chip(t, n, tag === t, () => { tag = tag === t ? null : t; render(); })));
  const shown = ofType.filter(w => !tag || w.tags.includes(tag));
  $('grid').innerHTML = shown.map(w => `<a href="${w.slug}/" title="${esc(w.desc)}">
    <img src="${w.slug}/thumb.jpg" alt="" loading="lazy" width="1200" height="630">
    <div><div class="k">${esc(w.kicker)}</div><div class="t">${esc(w.title)}</div></div></a>`).join('');
  $('empty').hidden = shown.length > 0;
}
render();
</script>
</body></html>
