<title>Cube Lab — benchtop</title>
<meta name="description" content="REPLACE: one sentence on what the reader will understand.">
<meta property="og:title" content="Cube Lab"><meta property="og:description" content="REPLACE: same sentence."><meta property="og:image" content="thumb.jpg">

<body>
<script type="module">
import { createExplainer } from '../lib/explainer.js';
import { model } from './model.js';

const f = (v, d = 2) => (Number.isFinite(v) ? v.toFixed(d) : '—');

createExplainer({
  // ---------- Config (REPLACE every value; keep the shape; see API.md) ----------
  slug: 'REPLACE-slug', kicker: 'How size scales', title: 'Cube Lab',
  hook: 'Double the side of a cube and the surface quadruples while the volume grows eightfold. Try it.',
  type: 'explainer',
  state: { side: 1, spin: .4 },
  model,
  stats: [
    { key: 'volume', label: 'Volume', unit: ' m³', fmt: 2 },
    { key: 'area', label: 'Surface', unit: ' m²', fmt: 2 },
    { key: 'diagonal', label: 'Diagonal', unit: ' m', fmt: 2 },
  ],
  narrate: (s, m) => `A cube with sides of <b class="c-a">${f(s.side)} m</b> holds <b class="c-b">${f(m.volume)} m³</b> and has <b class="c-c">${f(m.area)} m²</b> of surface.`,
  controls: [
    { type: 'slider', key: 'side', label: 'Side', min: .2, max: 1.6, step: .01, unit: ' m', fmt: 2, keys: ['[', ']'] },
    { type: 'slider', key: 'spin', label: 'Spin', min: 0, max: 2, step: .05, unit: ' rad/s', fmt: 2, keys: ['-', '='] },
  ],
  modes: [
    { name: 'Unit cube', state: { side: 1, spin: .4 }, camera: 'lab', caption: 'One metre on a side' },
    { name: 'Double it', state: { side: 1.6, spin: .4 }, camera: 'close', caption: 'Bigger side, much bigger volume' },
  ],
  views: {
    lab: { label: 'Lab', pos: [1.6, 2.2, 3.4], target: [0, 1.1, 0] },
    close: { label: 'Close', pos: [.6, 1.7, 2.4], target: [0, 1.1, 0] },
    studio: { label: 'Studio', pos: [2.8, 3.0, 2.6], target: [0, 1.0, 0] },
  },
  labels: [
    { anchor: r => r.cubeAnchor, text: (s, m) => `Volume ${f(m.volume)} m³`, priority: 2 },
  ],
  screens: [{ mesh: r => r.screen, size: [640, 380], draw: drawChart }],
  sound: { ambient: 'room', ui: true },
  assumptions: 'REPLACE: data sources, simplifications, units, what the numbers leave out. Here: an ideal cube; scene units are metres.',

  // ---------- Build (scene only; every displayed number comes from model.js) ----------
  build(scene, kit) {
    const { THREE, mat } = kit;
    const room = kit.room({ w: 9, d: 7 }); room.position.z = -.5; scene.add(room);
    scene.add(kit.bench({ w: 3.6, d: 1.6, h: .8 }));
    const win = kit.windowLight({ from: [2.6, 3.4, -5.2], intensity: 2 }); win.group.position.set(1.9, 1.9, -3.98); scene.add(win.group);
    const lamp = new THREE.PointLight(0xffc88a, 8, 9, 2); lamp.position.set(-2.2, 2.4, 1.6); scene.add(lamp);
    scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a2f28, .2));
    const plant = kit.plant({ h: .7 }); plant.position.set(-1.4, .8, -.4); scene.add(plant);
    const shelf = kit.shelf(); shelf.position.set(-2.5, 0, -3.2); scene.add(shelf);

    const cube = kit.roundedBox(1, 1, 1, .03, mat.plastic(0xc9a45c, .35)); scene.add(cube);   // hero (scaled in update)
    const cubeAnchor = kit.anchor(); cube.add(cubeAnchor);
    const { group, screen } = kit.screenBezel(1.1, .65); group.position.set(1.25, 1.35, -.15); group.rotation.y = -.4; scene.add(group);
    const stand = kit.roundedBox(.08, .45, .06, .01, mat.metal(0x6f757c, .4)); stand.position.set(1.25, 1.02, -.2); scene.add(stand);
    return { cube, cubeAnchor, screen, kit };
  },

  // ---------- Update (animate the scene from state and model; no per-frame allocation) ----------
  update(r, s, m, dt) {
    r.cube.scale.setScalar(s.side); r.cube.position.y = .8 + s.side / 2; r.cube.rotation.y += s.spin * dt;
    r.cubeAnchor.position.set(0, .5 + .25 / s.side, 0);   // local to the scaled cube: always .25 m above its top
  },
});

// ---------- Screens ----------
function drawChart(ctx, s, m, r, w, h) {
  const { chart } = r.kit, area = { x: 70, y: 56, w: w - 100, h: h - 100 };
  chart.clear(ctx, w, h); chart.grid(ctx, area, 3, 4);
  chart.bars(ctx, area, [m.volume, m.area, m.diagonal], 12, { color: ['#7fd3ff', '#ffb454', '#ff7a90'], gap: 24 });
  chart.text(ctx, 'VOLUME  SURFACE  DIAGONAL', 70, 34, { size: 20, color: '#cfe3f0' });
}
</script>
</body>
</html>
