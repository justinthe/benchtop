<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Town Bank — benchtop</title>
<meta name="description" content="Why prices go up: pump new money into a small town's bank and watch the price tags in the bakery window climb.">
<meta property="og:title" content="Town Bank"><meta property="og:description" content="Inflation as more money chasing the same goods, in one small town."><meta property="og:image" content="thumb.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314110f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%237fd3ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../lib/explainer.css">
<script type="importmap">{"imports":{"three":"../lib/three.module.js","three/addons/":"../lib/addons/"}}</script>
</head>
<body>
<script type="module">
import { createExplainer } from '../lib/explainer.js';
import { model, STORY, BASE, SAVER, YEARS } from './model.js';

const FLOOR = 0, WALKERS = 8, SLOTS = 30;
const usd = v => (Number.isFinite(v) ? '$' + (v >= 1000 ? Math.round(v).toLocaleString('en-US') : v.toFixed(2)) : '—');
const big = v => '$' + Math.round(v).toLocaleString('en-US');
const pct = v => (v > 0.05 ? '+' : v < -0.05 ? '−' : '') + Math.abs(v).toFixed(1) + '%';
const yrs = y => `${y} year${y === 1 ? '' : 's'}`;
const leaveStory = () => ({ story: 0 });
// vault stack height: linear up to 3x the start, then compressed (log) so runaway money still fits in the vault
const stackH = i => { const r = i / 100; return r <= 3 ? .36 * r : Math.min(1.25, 1.08 + .12 * Math.log10(r / 3)); };

createExplainer({
  // ---------- Config ----------
  slug: 'money-inflation', kicker: 'Why prices go up', title: 'Town Bank',
  hook: 'A loaf of bread costs $3 today. Print more dollars without baking more bread, and watch what happens to that price tag.',
  type: 'explainer', fov: 40, bloom: .3, bloomThreshold: 1.0, environmentIntensity: .35,
  state: { money: 10, goods: 0, years: 0, story: 1 },
  model,
  stats: [
    { key: 'inflation', label: 'Prices per year', unit: ' %', fmt: 1, signed: true },
    { key: 'bread', label: 'Bread', unit: ' $', fmt: 2 },
    { key: 'loaves', label: `$${SAVER} buys`, unit: ' loaves', fmt: 0 },
  ],
  narrate,
  controls: [
    { type: 'slider', key: 'story', label: 'Story step', min: 0, max: 7, step: 1, unit: '', fmt: 0, keys: ['B', 'N'], patch: v => (STORY[v] ? { money: STORY[v].money, goods: STORY[v].goods, years: STORY[v].years } : {}) },
    { type: 'slider', key: 'money', label: 'Money growth', min: -5, max: 50, step: 1, unit: ' %/yr', fmt: 0, keys: ['[', ']'], patch: leaveStory },
    { type: 'slider', key: 'goods', label: 'Goods growth', min: -5, max: 10, step: .5, unit: ' %/yr', fmt: 1, keys: [';', "'"], patch: leaveStory },
    { type: 'slider', key: 'years', label: 'Years', min: 0, max: YEARS, step: 1, unit: ' yr', fmt: 0, keys: [',', '.'], patch: leaveStory },
  ],
  modes: [
    { name: 'Calm town', state: { ...pick(STORY[1]), story: 1 }, camera: 'town', caption: 'Press N to step through one year' },
    { name: 'Prices settle', state: { ...pick(STORY[5]), story: 5 }, camera: 'shop', caption: 'Ten percent more money, same bread' },
    { name: 'Goods keep up', state: { ...pick(STORY[7]), story: 7 }, camera: 'shop', caption: 'More bread too: prices hold' },
    { name: 'Runaway', state: { money: 50, goods: 0, years: 10, story: 0 }, camera: 'ledger', caption: 'Money grows half again every year' },
    { name: 'Deflation', state: { money: 0, goods: 5, years: 10, story: 0 }, camera: 'ledger', caption: 'Goods outrun money: prices fall' },
  ],
  views: {
    town: { label: 'Town', pos: [.9, 3.5, 6.4], target: [.5, 1.35, -1.8], phoneFit: 2.0 },
    shop: { label: 'Bakery', pos: [.5, 1.9, 2.3], target: [2.15, 1.05, -1.8], phoneFit: 1.35 },
    ledger: { label: 'Ledger', pos: [.85, 2.42, .35], target: [.85, 2.42, -3.95], phoneFit: 1.2 },
  },
  labels: [
    { anchor: r => r.vaultAnchor, text: (s, m) => `Money ${big(m.M)}`, priority: 3 },
    { anchor: r => r.shelfAnchor, text: (s, m) => `Goods ${Math.round(m.Q).toLocaleString('en-US')} baskets/yr`, priority: 2 },
    { anchor: r => r.jarAnchor, text: (s, m) => `$${SAVER} buys ${m.loaves} loaves`, priority: 4,
      info: (s, m) => `The saver's $${SAVER} never changes; the loaves it buys do. At today's prices it is worth <b>${usd(m.worth)}</b> of year-0 shopping. Inflation quietly moves value from people holding cash to people who owe dollars.` },
  ],
  screens: [
    { mesh: r => r.ledgerScreen, size: [960, 576], draw: drawLedger },
    { mesh: r => r.tagScreen, size: [512, 384], draw: drawTags },
    { mesh: r => r.signScreen, size: [512, 96], draw: (ctx, s, m, r, w, h) => sign(ctx, w, h, 'TOWN BANK') },
  ],
  sound: { ambient: 'room', ui: true },
  assumptions: 'Toy numbers from the topic: $100,000 in the town, each dollar spent 4 times a year (held fixed), 40,000 baskets of goods a year, so a basket costs $10 (M × V = P × Q). Each year money grows by the money-growth rate and goods by the goods-growth rate, and prices follow at once: P = M × 4 / Q. Yearly inflation = (1 + money growth) / (1 + goods growth) − 1. All price tags scale with P. In story steps 2 to 4 prices are shown part-way to their new level (0 %, 30 %, 70 %) to show the catch-up; the model itself has no lag. Vault stacks grow in proportion up to 3× the start, then compress so runaway money still fits; shelf goods show 20 items at the start and cap at 30. The ledger chart uses a log scale so 3 % and 50 % growth fit on one board. Not modelled: interest rates, wages, expectations, banks failing, other countries.',

  // ---------- Build ----------
  build(scene, kit) {
    const { THREE, mat } = kit;
    const room = kit.room({ w: 10, d: 7, wall: 0x857464 }); room.position.z = -.5; scene.add(room);
    const win = kit.windowLight({ from: [3, 3.4, -6], intensity: 1.6, w: 1.2, h: 1.4 }); win.group.position.set(3.6, 2.0, -3.98); scene.add(win.group);
    const lamp = new THREE.PointLight(0xffc88a, 8, 10, 2); lamp.position.set(-2.4, 2.6, 1.8); scene.add(lamp);
    scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a2f28, .22));
    const plant = kit.plant({ h: 1.0, leaves: 11 }); plant.position.set(-4.3, 0, -3.3); scene.add(plant);
    const street = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 7), mat.matte(0x2f2b28, .95)); street.rotation.x = -Math.PI / 2; street.position.set(.35, .004, -.5); street.receiveShadow = true; scene.add(street);

    // vault: open steel box with stacks of bills inside, round door swung open
    const steel = mat.metal(0x5d6268, .6), vault = new THREE.Group(); vault.position.set(-.35, FLOOR, -3.25); scene.add(vault);
    for (const [w, h, d, x, y, z] of [[1.4, 1.6, .08, 0, .8, -.5], [.08, 1.6, 1.0, -.66, .8, 0], [.08, 1.6, 1.0, .66, .8, 0], [1.4, .08, 1.0, 0, 1.56, 0], [1.4, .1, 1.0, 0, .05, 0]]) {
      const p = kit.roundedBox(w, h, d, .01, steel); p.position.set(x, y, z); vault.add(p);
    }
    const door = new THREE.Mesh(new THREE.CylinderGeometry(.7, .7, .12, 48), mat.matte(0x7a7f86, .55)); door.rotation.set(Math.PI / 2, 0, Math.PI / 2); door.position.set(1.02, .8, .5); door.rotation.y = .9; door.castShadow = true; vault.add(door);
    const wheel = new THREE.Mesh(new THREE.TorusGeometry(.2, .025, 8, 32), mat.metal(0xc9a45c, .3)); wheel.position.copy(door.position); wheel.position.x += .07; wheel.position.z += .05; wheel.rotation.y = Math.PI / 2 + .9; vault.add(wheel);
    const billMat = mat.matte(0x6f9a63, .7), stacks = [];
    for (let i = 0; i < 6; i++) { const b = kit.roundedBox(.34, 1, .2, .01, billMat); b.position.set(-.4 + (i % 3) * .4, .1, -.22 + Math.floor(i / 3) * .3); vault.add(b); stacks.push(b); }
    const vaultAnchor = kit.anchor(0, .22, .65); vault.add(vaultAnchor);
    const { group: bankSign, screen: signScreen } = kit.screenBezel(1.2, .225, { depth: .03, border: .02, color: 0x2a2623 }); bankSign.position.set(-1.7, .72, -1.005); scene.add(bankSign);

    // teller counter with the saver's jar
    const counter = kit.roundedBox(1.7, 1.0, .55, .02, mat.matte(0x6b4a32, .6)); counter.position.set(-1.7, .5, -1.3); scene.add(counter);
    const counterTop = kit.roundedBox(1.8, .05, .65, .01, mat.matte(0x4a3324, .5)); counterTop.position.set(-1.7, 1.02, -1.3); scene.add(counterTop);
    const jar = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, .26, 28, 1, true), mat.glass(0xdff2ff, .3)); jar.position.set(-1.3, 1.175, -1.2); scene.add(jar);
    const jarBills = new THREE.Mesh(new THREE.CylinderGeometry(.1, .1, .14, 20), billMat); jarBills.position.set(-1.3, 1.115, -1.2); scene.add(jarBills);
    const lidJ = new THREE.Mesh(new THREE.CylinderGeometry(.115, .115, .025, 28), mat.metal(0xc9a45c, .35)); lidJ.position.set(-1.3, 1.32, -1.2); scene.add(lidJ);
    const jarAnchor = kit.anchor(-1.05, 1.5, -1.0); scene.add(jarAnchor);

    // bakery: shelf of goods under an awning, chalkboard price tags
    const shop = new THREE.Group(); shop.position.set(1.9, FLOOR, -2.7); scene.add(shop);
    const wood = mat.matte(0x5c4330, .7);                                                          // own shelf: kit.shelf comes filled with books
    for (let i = 0; i < 4; i++) { const b = kit.roundedBox(1.8, .03, .4, .008, wood); b.position.y = i * .5; shop.add(b); }
    for (const sx of [-1, 1]) { const sd = kit.roundedBox(.03, 1.5, .4, .008, wood); sd.position.set(sx * .885, .75, 0); shop.add(sd); }
    const goodsMat = mat.matte(0xc58a46, .7), goodsGeo = new THREE.BoxGeometry(.13, .11, .22), goods = new THREE.InstancedMesh(goodsGeo, goodsMat, SLOTS);
    goods.castShadow = true; const tmp = new THREE.Object3D();
    for (let i = 0; i < SLOTS; i++) { tmp.position.set(-.78 + (i % 10) * .173, .07 + Math.floor(i / 10) * .5, 0); tmp.updateMatrix(); goods.setMatrixAt(i, tmp.matrix); }
    goods.count = 0; shop.add(goods);
    for (let i = 0; i < 6; i++) {                                                                   // striped awning
      const a = kit.roundedBox(.33, .04, .7, .005, mat.matte(i % 2 ? 0xe8e4dc : 0xb4453a, .7)); a.position.set(-.83 + i * .333, 1.72, .22); a.rotation.x = .35; shop.add(a);
    }
    const shelfAnchor = kit.anchor(-.45, 1.3, .3); shop.add(shelfAnchor);
    const { group: board, screen: tagScreen } = kit.screenBezel(.8, .6, { depth: .04, border: .035, color: 0x5c4330 }); board.position.set(1.3, 1.15, -.85); board.rotation.y = -.35; scene.add(board);
    for (const sx of [-1, 1]) { const leg = kit.roundedBox(.035, 1.0, .035, .005, mat.matte(0x5c4330, .7)); leg.position.set(1.3 + sx * .35 * Math.cos(.35), .5, -.85 + sx * .35 * Math.sin(.35) - .04); scene.add(leg); }

    // ledger board on the back wall
    const { group: ledger, screen: ledgerScreen } = kit.screenBezel(2.2, 1.32, { depth: .04, border: .04 }); ledger.position.set(.85, 2.42, -3.95); scene.add(ledger);

    // townsfolk walking between the bank counter and the bakery
    const bodyGeo = new THREE.CapsuleGeometry(.09, .5, 4, 10), headGeo = new THREE.SphereGeometry(.085, 16, 12), cashGeo = new THREE.BoxGeometry(.12, .05, .08);
    const coats = [0x3d5a80, 0x8a4f3d, 0x4f6b4a, 0x6d5a7a, 0x9a7b4f, 0x3f4d55, 0x7a3f4f, 0x556b2f];
    const walkers = [];
    for (let i = 0; i < WALKERS; i++) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(bodyGeo, mat.matte(coats[i], .8)); body.position.y = .38; body.castShadow = true; g.add(body);
      const head = new THREE.Mesh(headGeo, mat.matte(0xd9b08c, .7)); head.position.y = .78; head.castShadow = true; g.add(head);
      const cash = new THREE.Mesh(cashGeo, billMat); cash.position.set(.12, .45, 0); g.add(cash);
      g.userData = { phase: i / WALKERS, lane: -.15 + (i % 4) * .22, cash }; scene.add(g); walkers.push(g);
    }
    return { stacks, goods, walkers, vaultAnchor, shelfAnchor, jarAnchor, jarBills, ledgerScreen, tagScreen, signScreen, clock: 0, kit };
  },

  // ---------- Update ----------
  update(r, s, m, dt) {
    const h = stackH(m.Mi);
    for (const b of r.stacks) { b.scale.y = h; b.position.y = .1 + h / 2; }
    r.goods.count = Math.max(0, Math.min(SLOTS, Math.round(20 * m.Qi / 100)));
    r.jarBills.scale.x = r.jarBills.scale.z = .45 + .55 * Math.min(1, m.loaves / m.loaves0);     // the jar's buying power, not its dollars
    const busy = Math.max(2, Math.min(WALKERS, Math.round(3 + s.money / 8))), speed = .05 + .006 * Math.max(0, s.money + 5);
    r.clock += dt * speed;
    r.walkers.forEach((g, i) => {
      g.visible = i < busy; if (!g.visible) return;
      const u = (r.clock + g.userData.phase) % 1, out = u < .5, k = out ? u * 2 : 2 - u * 2;   // out to the bakery, back to the bank
      g.position.set(-1.1 + k * 2.3, FLOOR, -.1 + g.userData.lane + Math.sin(k * Math.PI) * .25);
      g.rotation.y = out ? Math.PI / 2 : -Math.PI / 2;
      g.position.y = Math.abs(Math.sin(r.clock * 60 + i)) * .02;
      g.userData.cash.visible = out;
    });
  },
});

// ---------- Helpers (hoisted: createExplainer calls them during setup) ----------
function pick(st) { return { money: st.money, goods: st.goods, years: st.years }; }

function narrate(s, m) {
  const b = `<b class="c-b">${usd(m.bread)}</b>`, loaves = `<b class="c-c">${m.loaves} loaves</b>`;
  switch (m.step) {
    case 1: return `The town has <b class="c-a">${big(m.M)}</b> and bakes ${Math.round(m.Q).toLocaleString('en-US')} baskets of goods a year. Bread costs ${b}, so the saver's $${SAVER} buys ${loaves}. Press N to follow one year.`;
    case 2: return `The bank makes new loans and the vault grows to <b class="c-a">${big(m.M)}</b>. These are new dollars, not anyone's savings moved. The bread on the shelf has not changed, and nor has its price: ${b}.`;
    case 3: return `Borrowers walk over and spend. More dollars arrive at the bakery, but there is no more bread. Bread is already ${b} as shoppers outbid each other.`;
    case 4: return `Bread sells out early, so the baker raises the price to ${b}. The milk and bike sellers see the same crowds and follow.`;
    case 5: return `Prices settle <b class="c-c">${pct(m.inflation)}</b> higher: bread is ${b}. Nothing about the bread changed; each dollar now buys less of it.`;
    case 6: return `The saver's $${SAVER} now buys ${loaves} instead of ${m.loaves0}, worth ${usd(m.worth)} in last year's money. A borrower repays with these cheaper dollars, so they come out ahead.`;
    case 7: return `Now the bakery grows <b class="c-d">${s.goods.toFixed(0)}%</b> too. Shelves fill as fast as the vault, and bread stays at ${b}. Money only pushes prices up when it outruns goods.`;
  }
  let t = `Money grows <b class="c-a">${pct(s.money)}</b> a year and goods <b class="c-d">${pct(s.goods)}</b>, so prices change <b class="c-b">${pct(m.inflation)}</b> a year. `;
  if (s.years === 0) return t + `Move the years slider to see where that leads. Today bread costs ${b}.`;
  t += `After ${yrs(s.years)} the town has ${big(m.M)} and bread costs ${b} (it was $${BASE.bread.toFixed(2)}). `;
  if (Math.abs(m.inflation) < .05) return t + `Money and goods grow together, so the saver's $${SAVER} still buys ${loaves}.`;
  if (m.inflation < 0) return t + `That is deflation: goods outrun money, so the saver's $${SAVER} buys ${loaves}, more than at the start. Borrowers now repay in dearer dollars.`;
  if (m.inflation >= 25) return t + `This is runaway inflation. The saver's $${SAVER} buys ${loaves}; people rush to spend cash before it loses more, which only makes things worse.`;
  return t + `The saver's $${SAVER} buys ${loaves}, worth <b class="c-c">${usd(m.worth)}</b> of year-0 shopping.`;
}

// ---------- Screens ----------
function drawLedger(ctx, s, m, r, w, h) {
  const { chart } = r.kit; chart.clear(ctx, w, h, '#0d1114');
  const infl = m.inflation, col = infl > .05 ? '#ffb454' : infl < -.05 ? '#7fd3ff' : '#cfe3f0';
  chart.text(ctx, 'TOWN LEDGER', 40, 52, { size: 28, color: '#cfe3f0' });
  chart.text(ctx, `${infl > .05 ? 'INFLATION' : infl < -.05 ? 'DEFLATION' : 'STEADY PRICES'} ${pct(infl)}/yr`, w - 40, 52, { size: 30, color: col, align: 'right' });
  chart.text(ctx, `Year ${s.years}   bread ${usd(m.bread)}   $${SAVER} = ${m.loaves} loaves`, 40, 96, { size: 25, color: '#ffffff' });
  // log-scale index chart, year 0 = 100
  const a = { x: 110, y: 130, w: w - 300, h: h - 200 }, all = [...m.series.M, ...m.series.Q, ...m.series.P];
  const lo = Math.floor(Math.log10(Math.min(...all)) * 2) / 2 - .1, hi = Math.ceil(Math.log10(Math.max(...all)) * 2) / 2 + .1, L = v => Math.log10(v), rng = { x: [0, YEARS], y: [lo, hi] };
  chart.grid(ctx, a, 4, 4);
  const Y = v => a.y + a.h - (L(v) - lo) / (hi - lo) * a.h, X = y => a.x + y / YEARS * a.w;
  ctx.setLineDash([6, 6]); chart.line(ctx, a, [0, YEARS], [2, 2], rng, { color: 'rgba(207,227,240,.4)', width: 2 }); ctx.setLineDash([]);
  const series = [['Money', m.series.M, '#7fd3ff'], ['Goods', m.series.Q, '#8fe388'], ['Prices', m.series.P, '#ffb454']];
  for (const [, v, c] of series) chart.line(ctx, a, m.series.years, v.map(L), rng, { color: c, width: 5 });
  // current year marker (drawn at the shown price, which lags in story steps 2-4)
  const cx = X(s.years); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, a.y); ctx.lineTo(cx, a.y + a.h); ctx.stroke();
  for (const [v, c] of [[m.Mi, '#7fd3ff'], [m.Qi, '#8fe388'], [m.Pi, '#ffb454']]) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx, Y(v), 9, 0, 7); ctx.fill(); }
  // legend with end values, nudged apart so they never overlap
  const ends = series.map(([n, v, c]) => ({ n, c, v: v[YEARS], y: Y(v[YEARS]) })).sort((p, q) => p.y - q.y);
  for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + 52);
  for (const e of ends) { chart.text(ctx, e.n, a.x + a.w + 16, e.y - 2, { size: 23, color: e.c }); chart.text(ctx, `×${fmtX(e.v / 100)}`, a.x + a.w + 16, e.y + 24, { size: 20, color: e.c }); }
  chart.text(ctx, 'start', a.x - 12, Y(100) + 7, { size: 19, color: '#cfe3f0', align: 'right' });
  chart.text(ctx, 'year 0', a.x, h - 30, { size: 19, color: '#cfe3f0' }); chart.text(ctx, `year ${YEARS}`, a.x + a.w, h - 30, { size: 19, color: '#cfe3f0', align: 'right' });
  chart.text(ctx, 'log scale: equal steps = equal % change', w / 2 - 80, h - 30, { size: 18, color: 'rgba(207,227,240,.6)', align: 'center' });
}
function fmtX(v) { return v >= 100 ? Math.round(v).toLocaleString('en-US') : v.toFixed(v >= 10 ? 1 : 2); }

function drawTags(ctx, s, m, r, w, h) {
  ctx.fillStyle = '#1f2a24'; ctx.fillRect(0, 0, w, h);
  const T = (str, x, y, size, color, align = 'left') => { ctx.font = `600 ${size}px "JetBrains Mono", monospace`; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(str, x, y); };
  T('BAKERY PRICES', w / 2, 52, 30, '#f2ede2', 'center');
  const rows = [['Bread', m.bread, BASE.bread], ['Milk', m.milk, BASE.milk], ['Bike', m.bike, BASE.bike]];
  rows.forEach(([n, v, was], i) => {
    const y = 130 + i * 90; T(n, 36, y, 36, '#f2ede2'); T(usd(v), w - 36, y, 40, '#ffd27a', 'right');
    if (Math.abs(v - was) > .005) T(`was ${usd(was)}`, w - 36, y + 32, 20, 'rgba(242,237,226,.55)', 'right');
  });
}

function sign(ctx, w, h, text) {
  ctx.fillStyle = '#2a2623'; ctx.fillRect(0, 0, w, h);
  ctx.font = '700 58px "Barlow Condensed", "JetBrains Mono", sans-serif'; ctx.fillStyle = '#e8c27a'; ctx.textAlign = 'center'; ctx.fillText(text, w / 2, 68);
}
</script>
</body>
</html>
